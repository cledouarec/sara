[package]
name = "sara-cli"
description = "CLI for Sara - Requirements Knowledge Graph"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sara"
path = "src/main.rs"

[dependencies]
sara-core = { path = "../sara-core", version = "0.11.3" }
sara-mcp = { path = "../sara-mcp", version = "0.11.3", optional = true }
clap.workspace = true
colored.workspace = true
console.workspace = true
indexmap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
inquire.workspace = true
thiserror.workspace = true

[features]
default = ["mcp"]
# `sara mcp`: serves the knowledge graph to AI agents over the Model
# Context Protocol.
mcp = ["dep:sara-mcp"]

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
